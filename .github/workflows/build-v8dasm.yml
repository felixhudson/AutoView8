name: Build V8 Disassembler (v8dasm)

on:
  push:
    branches: [ main, 'version-*' ]
    paths:
      - 'Disassembler/**'
      - 'scripts/v8dasm-builders/**'
      - 'configs/v8-versions.json'
      - '.github/workflows/build-v8dasm.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      v8_version:
        description: 'V8 version to build (leave empty to build all)'
        required: false
        default: ''

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up build matrix
        id: set-matrix
        run: |
          if [ -n "${{ github.event.inputs.v8_version }}" ]; then
            echo "matrix={\"version\":[{\"v8\":\"${{ github.event.inputs.v8_version }}\",\"args\":\"v8_enable_pointer_compression=false\"}]}" >> $GITHUB_OUTPUT
          else
            VERSIONS=$(jq -c '[.versions[] | {v8: .v8_version, node: .node_version, args: .build_args}]' configs/v8-versions.json)
            echo "matrix={\"version\":$VERSIONS}" >> $GITHUB_OUTPUT
          fi

  build-windows:
    name: Windows x64 - V8 ${{ matrix.version.v8 }}
    runs-on: windows-2022
    needs: prepare
    env:
      # Outside the workspace so actions/checkout never touches it.
      V8_ROOT: D:\v8root
      # Echo every batch command before it runs. Set to "0" for a quieter log.
      V8DASM_DEBUG: "1"
      # V8 10.2's bundled clang can't parse the newest MSVC STL (14.4x);
      # build against the VS2019-era v142 toolset instead.
      V8DASM_MSVC_TOOLSET: "14.29"
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ensure MSVC ${{ env.V8DASM_MSVC_TOOLSET }} toolset
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -products * -property installationPath
          $msvc = Join-Path $vs 'VC\Tools\MSVC'
          Write-Host "Visual Studio: $vs"
          Write-Host "Installed MSVC toolsets:"
          Get-ChildItem $msvc -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
          if (Get-ChildItem $msvc -Directory -Filter "$env:V8DASM_MSVC_TOOLSET.*") {
            Write-Host "MSVC $env:V8DASM_MSVC_TOOLSET already installed"
            exit 0
          }
          Write-Host "Installing MSVC v142 (14.29) build tools..."
          $p = Start-Process -Wait -PassThru -FilePath "$installer\vs_installer.exe" -ArgumentList @(
            'modify', '--installPath', "`"$vs`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64',
            '--quiet', '--norestart', '--nocache')
          Write-Host "vs_installer exit code: $($p.ExitCode)"
          if (-not (Get-ChildItem $msvc -Directory -Filter "$env:V8DASM_MSVC_TOOLSET.*")) {
            Write-Error "MSVC $env:V8DASM_MSVC_TOOLSET still not installed"
            exit 1
          }

      # depot_tools + the synced V8 checkout (incl. gclient deps) live in
      # V8_ROOT and are cached as one entry per V8 version. The cache is
      # saved right after the sync step, so a later failure (patch, compile)
      # does not throw the checkout away. Bump the -v1 suffix to force a
      # fresh checkout.
      - name: Restore V8 checkout cache
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.V8_ROOT }}
          key: v8-checkout-windows-${{ matrix.version.v8 }}-v1

      - name: Sync V8 source
        if: steps.v8-cache.outputs.cache-hit != 'true'
        shell: cmd
        env:
          V8DASM_STAGE: sync
        run: |
          call scripts\v8dasm-builders\build-windows.cmd ${{ matrix.version.v8 }} "${{ matrix.version.args }}"

      - name: Save V8 checkout cache
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.V8_ROOT }}
          key: v8-checkout-windows-${{ matrix.version.v8 }}-v1

      - name: Build v8dasm
        shell: cmd
        env:
          V8DASM_STAGE: build
        run: |
          call scripts\v8dasm-builders\build-windows.cmd ${{ matrix.version.v8 }} "${{ matrix.version.args }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8dasm-windows-x64-v${{ matrix.version.v8 }}
          path: ${{ env.V8_ROOT }}\v8\v8\v8dasm-${{ matrix.version.v8 }}.exe
          retention-days: 30

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          cd artifacts

          for dir in v8dasm-*; do
            platform=$(echo $dir | sed 's/v8dasm-//' | sed 's/-v[0-9].*//')
            version=$(echo $dir | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')

            cd $dir
            if [ -f v8dasm-${version}.exe ]; then
              zip ../../release/${platform}-${version}.zip v8dasm-${version}.exe
            elif [ -f v8dasm-${version} ]; then
              zip ../../release/${platform}-${version}.zip v8dasm-${version}
            fi
            cd ..
          done

      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## V8 Disassembler 二进制文件

          此版本包含多个平台和 V8 版本的预编译 v8dasm 二进制文件。

          ### 支持的平台:
          - Windows x64

          ### 使用方法:
          下载适合您平台和 V8 版本的二进制文件，然后配合 View8 使用:
          ```bash
          python view8.py input.jsc output.js --path ./v8dasm
          ```

          ### 构建信息:
          - 构建自 commit: ${{ github.sha }}
          - 构建时间: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v8dasm-${{ github.run_number }}
          name: V8 Disassembler Build ${{ github.run_number }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
